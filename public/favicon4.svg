<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Black hole galaxy favicon</title>
  <desc id="desc">A minimal transparent-background black hole icon with a glowing golden ring, purple orbit, and bright star flare.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="68%" stop-color="#020107"/>
      <stop offset="82%" stop-color="#2a124d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffd36a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldRing" x1="38" y1="118" x2="218" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4bf"/>
      <stop offset="36%" stop-color="#ffd15a"/>
      <stop offset="58%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff9f38"/>
    </linearGradient>

    <linearGradient id="purpleArc" x1="45" y1="184" x2="222" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c16ff" stop-opacity="0"/>
      <stop offset="28%" stop-color="#8e2cff" stop-opacity="0.95"/>
      <stop offset="67%" stop-color="#c95cff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6b22ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.55  0 0 1 0 0.05  0 0 0 0.9 0" result="warmBlur"/>
      <feMerge>
        <feMergeNode in="warmBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background intentionally left empty -->

  <!-- subtle deep-space halo -->
  <circle cx="128" cy="128" r="104" fill="#100821" opacity="0.72"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#24104d" stroke-width="1.5" opacity="0.35"/>

  <!-- purple galaxy/accretion arc -->
  <path d="M42 145 C54 68, 156 42, 213 94 C234 114, 228 151, 204 176"
        fill="none" stroke="url(#purpleArc)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)" opacity="0.88"/>

  <!-- warm accretion ring -->
  <ellipse cx="128" cy="128" rx="72" ry="58" fill="none" stroke="url(#goldRing)" stroke-width="9" filter="url(#strongGlow)"/>

  <!-- foreground swoosh to imply galaxy motion -->
  <path d="M47 143 C78 191, 158 199, 213 151"
        fill="none" stroke="url(#goldRing)" stroke-width="8" stroke-linecap="round" filter="url(#strongGlow)" opacity="0.92"/>

  <!-- black hole core -->
  <circle cx="128" cy="128" r="55" fill="url(#coreGlow)"/>
  <circle cx="128" cy="128" r="50" fill="#000000"/>

  <!-- small glossy rim highlight -->
  <path d="M86 107 C101 80, 154 75, 177 104" fill="none" stroke="#fff7cf" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- star flare -->
  <g transform="translate(177 82)" filter="url(#strongGlow)">
    <path d="M0 -39 C4 -11, 11 -4, 39 0 C11 4, 4 11, 0 39 C-4 11, -11 4, -39 0 C-11 -4, -4 -11, 0 -39Z"
          fill="#fff7d6"/>
    <path d="M0 -22 C2 -6, 6 -2, 22 0 C6 2, 2 6, 0 22 C-2 6, -6 2, -22 0 C-6 -2, -2 -6, 0 -22Z"
          fill="#ffffff" opacity="0.96"/>
  </g>
</svg>
